name: KnifeTerminal
options:
  bundleIdPrefix: com.cwandt
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

settings:
  base:
    DEVELOPMENT_TEAM: L6DVQR8JB9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.4.33"
    CURRENT_PROJECT_VERSION: "1.1.13"  # CFBundleVersion must increase each release — Sparkle compares it
    # CloudKit container the Mac and iOS apps sync through (read at runtime via
    # the KnifeCloudContainer Info.plist key). Override with your own team's
    # container when signing outside CW&T — it must match the entitlements.
    KNIFE_CLOUD_CONTAINER: iCloud.com.cwandt.knifeterminal
    # Sparkle appcast the Mac app updates from (Info.plist SUFeedURL). A build
    # that isn't CW&T's overrides it, or the next CW&T release replaces it.
    KNIFE_FEED_URL: https://raw.githubusercontent.com/cheewee2000/knife-terminal/main/appcast.xml
    # A second Knife for another Claude Code account (`make install-mac-2`, see the Makefile). Empty = the
    # main app. Read at runtime from Info.plist by macOS/Instance.swift.
    KNIFE_APP_NAME: Knife Terminal
    KNIFE_ICON: icon
    KNIFE_INSTANCE: ""
    KNIFE_CLAUDE_CONFIG_DIR: ""
    KNIFE_TINT: ""

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # below 1.99: it makes `selection` internal and drops getTerminal() and the
    # dataReceived override KnifeTermView is built on
    minVersion: 1.2.0
    maxVersion: 1.99.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  KnifeKit:
    path: KnifeKit

targets:
  KnifeMac:
    type: application
    platform: macOS
    sources:
      - path: macOS
      - path: Resources
        buildPhase: resources
      - path: Fonts
        buildPhase: resources
      - path: AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - package: Sparkle
      - package: KnifeKit
    info:
      path: macOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: $(KNIFE_APP_NAME)
        CFBundleDisplayName: $(KNIFE_APP_NAME)
        CFBundleIconFile: $(KNIFE_ICON)
        KnifeInstance: $(KNIFE_INSTANCE)
        KnifeClaudeConfigDir: $(KNIFE_CLAUDE_CONFIG_DIR)
        KnifeTint: $(KNIFE_TINT)
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        ATSApplicationFontsPath: "."
        NSAppleEventsUsageDescription: Knife Terminal opens folders and scripts you send it.
        NSHumanReadableCopyright: CW&T
        KnifeCloudContainer: $(KNIFE_CLOUD_CONTAINER)
        CKSharingSupported: true
        SUFeedURL: $(KNIFE_FEED_URL)
        SUPublicEDKey: IsZ2LtddRqNHFHsp6U40Gw/A6sWIJO4m5xJYr1r4qic=
        SUEnableAutomaticChecks: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Shell Script
            CFBundleTypeRole: Shell
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.terminal.shell-script
              - public.shell-script
              - public.bash-script
              - public.zsh-script
              - public.unix-executable
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes:
              - public.folder
        CFBundleURLTypes:
          - CFBundleURLName: Remote shell
            CFBundleURLSchemes: [ssh, telnet, x-man-page]
    settings:
      base:
        PRODUCT_NAME: Knife Terminal
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.knifeterminal
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # entitlements files are maintained by hand (not xcodegen-generated):
        # Debug adds icloud-container-environment=Production so dev builds see
        # the same CloudKit data as App Store / notarized-release builds
        Debug:
          CODE_SIGN_ENTITLEMENTS: macOS/KnifeMac.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: macOS/KnifeMac.entitlements

  KnifeiOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Fonts
        buildPhase: resources
      - path: AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: KnifeKit
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Knife
        CFBundleDisplayName: Knife
        KnifeCloudContainer: $(KNIFE_CLOUD_CONTAINER)
        UILaunchScreen: {}
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
          - JetBrainsMono-Italic.ttf
          - JetBrainsMono-BoldItalic.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        CKSharingSupported: true
    settings:
      base:
        PRODUCT_NAME: Knife
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.knifeterminal.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: iOS/KnifeiOS.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: iOS/KnifeiOS.entitlements

schemes:
  KnifeMac:
    build:
      targets: { KnifeMac: all }
  KnifeiOS:
    build:
      targets: { KnifeiOS: all }
